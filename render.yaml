services:
  - type: web
    name: aesl
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn aesl.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.3
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DB_SSL_REQUIRE
        value: "True"
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: aesl-db
          property: connectionString

databases:
  - name: aesl-db
    plan: free