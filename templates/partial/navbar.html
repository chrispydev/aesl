{% load static %}
<aside class="sidebar" aria-label="Primary sidebar">
  <div class="sidebar__inner">
    <a href="{% url 'home' %}" class="sidebar__brand">
      <img class="sidebar__logo" src="{% static 'img/aesl_logo.png' %}" alt="AESL logo" />
      <div class="sidebar__brand-text">
        <span class="sidebar__name">AESL</span>
        <span class="sidebar__tagline">Consulting Architects, Engineers &amp; Surveyors</span>
      </div>
    </a>

    <div class="sidebar__meta">
      <span class="sidebar__meta-line"></span>
      <span class="sidebar__meta-text">Since 1973</span>
      <span class="sidebar__meta-line"></span>
    </div>

    <div class="search__container sidebar__search">
      <div class="search__input-container">
        <i class="fa fa-search search__icon" aria-hidden="true"></i>
        <input
          id="nav-search"
          class="search__input"
          placeholder="Search people or projects"
          type="search"
          aria-label="Search people or projects"
        />
        <button class="search__btn" type="button" aria-label="Search">
          <i class="fa fa-arrow-right" aria-hidden="true"></i>
        </button>
      </div>
      <div id="search-results" class="search__results-container"></div>
    </div>

    <nav class="nav__menu sidebar__nav" aria-label="Primary navigation">
      <p class="sidebar__section-label">Navigate</p>
      <a class="nav__menu-link {% if request.resolver_match.url_name == 'projects' %}active__link{% endif %}" href="{% url 'projects' %}">
        <span class="nav__menu-icon"><i class="fas fa-building" aria-hidden="true"></i></span>
        <span class="nav__menu-text">Projects</span>
        <i class="fas fa-chevron-right nav__menu-arrow" aria-hidden="true"></i>
      </a>
      <a class="nav__menu-link {% if request.resolver_match.url_name == 'practice' %}active__link{% endif %}" href="{% url 'practice' %}">
        <span class="nav__menu-icon"><i class="fas fa-city" aria-hidden="true"></i></span>
        <span class="nav__menu-text">Practice</span>
        <i class="fas fa-chevron-right nav__menu-arrow" aria-hidden="true"></i>
      </a>
      <a class="nav__menu-link {% if request.resolver_match.url_name == 'principles' %}active__link{% endif %}" href="{% url 'principles' %}">
        <span class="nav__menu-icon"><i class="fas fa-drafting-compass" aria-hidden="true"></i></span>
        <span class="nav__menu-text">Principles</span>
        <i class="fas fa-chevron-right nav__menu-arrow" aria-hidden="true"></i>
      </a>
      <a class="nav__menu-link {% if request.resolver_match.url_name == 'people' %}active__link{% endif %}" href="{% url 'people' %}">
        <span class="nav__menu-icon"><i class="fas fa-users" aria-hidden="true"></i></span>
        <span class="nav__menu-text">People</span>
        <i class="fas fa-chevron-right nav__menu-arrow" aria-hidden="true"></i>
      </a>
      <a class="nav__menu-link {% if request.resolver_match.url_name == 'news_list' %}active__link{% endif %}" href="{% url 'news_list' %}">
        <span class="nav__menu-icon"><i class="fas fa-newspaper" aria-hidden="true"></i></span>
        <span class="nav__menu-text">News</span>
        <i class="fas fa-chevron-right nav__menu-arrow" aria-hidden="true"></i>
      </a>
      <a class="nav__menu-link {% if request.resolver_match.url_name == 'publications' %}active__link{% endif %}" href="{% url 'publications' %}">
        <span class="nav__menu-icon"><i class="fas fa-book-open" aria-hidden="true"></i></span>
        <span class="nav__menu-text">Publications</span>
        <i class="fas fa-chevron-right nav__menu-arrow" aria-hidden="true"></i>
      </a>
    </nav>

    <div class="sidebar__footer">
      <div class="sidebar__contact">
        <p class="sidebar__contact-label">Head Office</p>
        <p class="sidebar__contact-value">Ministries, Accra, Ghana</p>
      </div>
      <div class="sidebar__socials">
        <a href="#" class="sidebar__social" aria-label="Facebook"><i class="fab fa-facebook-f" aria-hidden="true"></i></a>
        <a href="#" class="sidebar__social" aria-label="Twitter"><i class="fab fa-x-twitter" aria-hidden="true"></i></a>
        <a href="https://www.linkedin.com/company/aesl-ghana/" target="_blank" rel="noopener noreferrer" class="sidebar__social" aria-label="LinkedIn"><i class="fab fa-linkedin-in" aria-hidden="true"></i></a>
        <a href="#" class="sidebar__social" aria-label="YouTube"><i class="fab fa-youtube" aria-hidden="true"></i></a>
      </div>

    </div>
  </div>
</aside>

<!-- Mobile top bar -->
<nav class="mobile__nav" aria-label="Mobile navigation">
  <a href="{% url 'home' %}" class="mobile__brand">
    <img class="mobileimg__logo" src="{% static 'img/aesl_logo.png' %}" alt="AESL logo" />
    <div class="mobile__brand-text">
      <span class="mobile__brand-name">AESL</span>
      <span class="mobile__brand-tagline">Architects, Engineers &amp; Surveyors</span>
    </div>
  </a>
  <button class="mobile__menubtn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-drawer">
    <span class="mobile__menubtn-bars" aria-hidden="true"><span></span><span></span><span></span></span>
  </button>
</nav>

<!-- Mobile drawer -->
<div class="mobile__menuoverlay" aria-hidden="true">
  <div class="mobile__drawer" id="mobile-drawer" role="dialog" aria-modal="true" aria-label="Mobile menu">
    <div class="mobile__drawer-header">
      <a href="{% url 'home' %}" class="mobile__drawer-brand">
        <img src="{% static 'img/aesl_logo.png' %}" alt="AESL logo" />
        <div>
          <span class="mobile__drawer-name">AESL</span>
          <span class="mobile__drawer-tagline">Since 1973</span>
        </div>
      </a>
      <button id="closebtn" class="closebtn" type="button" aria-label="Close menu">
        <i class="fas fa-times" aria-hidden="true"></i>
      </button>
    </div>

    <div class="mobile__drawer-body">
      <div class="search__container mobile__search">
        <div class="search__input-container">
          <i class="fa fa-search search__icon" aria-hidden="true"></i>
          <input
            id="mobile-nav-search"
            class="search__input"
            placeholder="Search people or projects"
            type="search"
            aria-label="Search people or projects"
          />
          <button class="search__btn" type="button" aria-label="Search">
            <i class="fa fa-arrow-right" aria-hidden="true"></i>
          </button>
        </div>
        <div id="search-result" class="search__results-container"></div>
      </div>

      <nav class="nav__menu mobile__drawer-nav" aria-label="Mobile primary navigation">
        <a class="nav__menu-link {% if request.resolver_match.url_name == 'projects' %}active__link{% endif %}" href="{% url 'projects' %}">
          <span class="nav__menu-icon"><i class="fas fa-building" aria-hidden="true"></i></span>
          <span class="nav__menu-text">Projects</span>
        </a>
        <a class="nav__menu-link {% if request.resolver_match.url_name == 'practice' %}active__link{% endif %}" href="{% url 'practice' %}">
          <span class="nav__menu-icon"><i class="fas fa-city" aria-hidden="true"></i></span>
          <span class="nav__menu-text">Practice</span>
        </a>
        <a class="nav__menu-link {% if request.resolver_match.url_name == 'principles' %}active__link{% endif %}" href="{% url 'principles' %}">
          <span class="nav__menu-icon"><i class="fas fa-drafting-compass" aria-hidden="true"></i></span>
          <span class="nav__menu-text">Principles</span>
        </a>
        <a class="nav__menu-link {% if request.resolver_match.url_name == 'people' %}active__link{% endif %}" href="{% url 'people' %}">
          <span class="nav__menu-icon"><i class="fas fa-users" aria-hidden="true"></i></span>
          <span class="nav__menu-text">People</span>
        </a>
        <a class="nav__menu-link {% if request.resolver_match.url_name == 'news_list' %}active__link{% endif %}" href="{% url 'news_list' %}">
          <span class="nav__menu-icon"><i class="fas fa-newspaper" aria-hidden="true"></i></span>
          <span class="nav__menu-text">News</span>
        </a>
        <a class="nav__menu-link {% if request.resolver_match.url_name == 'publications' %}active__link{% endif %}" href="{% url 'publications' %}">
          <span class="nav__menu-icon"><i class="fas fa-book-open" aria-hidden="true"></i></span>
          <span class="nav__menu-text">Publications</span>
        </a>
      </nav>
    </div>

    <div class="mobile__drawer-footer">
      <div class="sidebar__socials">
        <a href="#" class="sidebar__social" aria-label="Facebook"><i class="fab fa-facebook-f" aria-hidden="true"></i></a>
        <a href="#" class="sidebar__social" aria-label="Twitter"><i class="fab fa-x-twitter" aria-hidden="true"></i></a>
        <a href="https://www.linkedin.com/company/aesl-ghana/" target="_blank" rel="noopener noreferrer" class="sidebar__social" aria-label="LinkedIn"><i class="fab fa-linkedin-in" aria-hidden="true"></i></a>
        <a href="#" class="sidebar__social" aria-label="YouTube"><i class="fab fa-youtube" aria-hidden="true"></i></a>
      </div>

    </div>
  </div>
</div>
