{% extends 'base.html' %}
{% load static %}

{% block content %}

<!-- Main content -->
<section class="managemet__parallax">
  <div class="projects__overlay"></div>
</section>

<section class="projects__caption">
  <div>
    <h1 class="projects__title">{{ staff.sub_category.main_category.name }}</h1>
  </div>
</section>

<div>
  <h1 class="projects__title-sub">{{ staff.sub_category.name }}</h1>
</div>


<section class="staff-detail">
  <div class="staff-detail__image">
    {% if staff.image %}
    <img src="{{ staff.image.url }}" alt="{{ staff.name }}" loading="lazy" />
    {% endif %}
  </div>
  <div class="staff-detail__content">
    <p class="staff-detail__description">"{{ staff.description }}"</p>
    <a href="mailto:{{ staff.email }}" class="staff-detail__email">{{ staff.email }}</a>
    <h4 class="staff-detail__name">{{ staff.name }}</h4>
    <div class="staff-detail__actions">
      <a href="{% url 'management' %}" class="staff-detail__btn">Back to Management</a>
    </div>
  </div>
</section>


{% endblock content %}
